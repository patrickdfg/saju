# main에 서버 코드가 병합되면 saju-ai Edge Function을 빌드하고 Supabase에 자동 배포한다.
name: Deploy saju-ai

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-saju-ai.yml'
  workflow_dispatch:

concurrency:
  group: deploy-saju-ai
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: maoylwwnluyyfmwqfkfl

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set; skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install and test
        if: steps.token.outputs.present == 'true'
        run: |
          npm ci
          npm test
      - name: Build function bundle
        if: steps.token.outputs.present == 'true'
        run: npx esbuild server/supabase-entry.mjs --bundle --format=esm --outfile=supabase/functions/saju-ai/index.ts --log-level=warning
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: latest
      - name: Deploy function
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy saju-ai --project-ref "$PROJECT_REF" --use-api || supabase functions deploy saju-ai --project-ref "$PROJECT_REF"
      - name: Smoke test
        if: steps.token.outputs.present == 'true'
        run: |
          token=$(grep -o 'ONDO_AI_PUBLIC_TOKEN = "[^"]*' ai-config.js | cut -d'"' -f2)
          url="https://${PROJECT_REF}.supabase.co/functions/v1/saju-ai"
          curl -fsS "$url/health" -H "apikey: $token" -H "Authorization: Bearer $token" -H "Origin: https://patrickdfg.github.io" | grep -q '"ready":true'
          body=$(curl -sS -X POST "$url" -H "apikey: $token" -H "Authorization: Bearer $token" -H "Origin: https://patrickdfg.github.io" -H "Content-Type: application/json" -H "X-Saju-Client: 12345678-1234-4123-8123-123456789abc" -d '{"face":{"image":{"mime":"image/jpeg","data":"AAAA"}}}')
          echo "$body" | grep -q '"invalid_image"'
